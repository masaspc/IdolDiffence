name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを 1 本に絞る。進行中のものはキャンセルせず、キューに積む
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      # 設計フェーズ（package.json 未追加）では以降を丸ごとスキップして成功で抜ける。
      # M0 で雛形をコミットした時点で自動的にビルドが走り出す。
      - name: Check if the app exists yet
        id: guard
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json がまだ無いためデプロイをスキップします（設計フェーズ）"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Validate game data
        if: steps.guard.outputs.ready == 'true'
        run: npm run validate:data

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: npm run build

      # enablement: true での自動有効化は使えない。GITHUB_TOKEN は pages: write を
      # 持っていてもサイトの**作成**はできず、Create Pages site が
      # 「Resource not accessible by integration」で落ちる。
      # 初回だけリポジトリ設定 → Pages → Source を「GitHub Actions」にする（README 参照）
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
